# Lädt die Website bei jedem Push auf "main" automatisch zu Infomaniak hoch.
# Benötigte GitHub-Secrets (Repo → Settings → Secrets and variables → Actions):
#   FTP_SERVER    z.B. abcd.ftp.infomaniak.com
#   FTP_USERNAME  FTP/SSH-Benutzer aus dem Infomaniak Manager
#   FTP_PASSWORD  Passwort dieses Benutzers
#   FTP_DIR       Zielordner der Website auf dem Server, mit / am Ende, z.B. /sites/julebuchmann.ch/
name: Deploy zu Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR }}
          # Videos werden separat hochgeladen und hier nie gelöscht/überschrieben
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            video/**
            split_intro.py
            .DS_Store
